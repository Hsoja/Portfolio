name: deploy-pages

# Publishes ONLY the public files (see scripts/build.sh) to the gh-pages branch,
# which GitHub Pages serves at https://hsoja.github.io/Portfolio/.
# Runs only after the security tests pass. Fast-forward commits, never force push.
on:
  push:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: pages
  cancel-in-progress: false

jobs:
  deploy:
    runs-on: ubuntu-latest
    permissions:
      contents: write   # only this job may push, and only to gh-pages
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          fetch-depth: 0
      - uses: actions/setup-node@949feb2413d6458794dcd2491c4babbbce0c15c1 # v7.1.0
        with:
          node-version: 22
      - run: npm test
      - run: npm run build
      - name: Publish _site to gh-pages
        run: |
          set -euo pipefail
          rm -f _site/_headers            # GitHub Pages ignores it; no need to publish it
          git config user.name  "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git fetch origin gh-pages
          git worktree add /tmp/pub origin/gh-pages -B gh-pages
          rsync -a --delete --exclude .git _site/ /tmp/pub/
          cd /tmp/pub
          git add -A
          if git diff --cached --quiet; then
            echo "No changes to publish."
          else
            git commit -m "deploy: ${GITHUB_SHA::7}"
            git push origin gh-pages
          fi
