name: security

on:
  push:
    branches: [main]
  pull_request:

permissions:
  contents: read

jobs:
  test:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - uses: actions/setup-node@949feb2413d6458794dcd2491c4babbbce0c15c1 # v7.1.0
        with:
          node-version: 22
      - run: npm test
      - run: npm run build
      - run: bash scripts/scan_exposed_files.sh

  server:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - run: pipx run --spec pytest==8.4.2 pytest -q tests/test_serve.py
      - run: pipx run --spec bandit==1.8.6 bandit -q -r serve.py --severity-level medium

  secrets:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          fetch-depth: 0
      - name: gitleaks (full history)
        run: >
          docker run --rm -v "$PWD:/repo" zricethezav/gitleaks:v8.28.0
          git /repo --log-opts=--all --redact=100 --no-banner

  semgrep:
    runs-on: ubuntu-latest
    container: semgrep/semgrep:1.140.0
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - run: semgrep scan --config p/javascript --config p/html --config p/python --config p/secrets --error --metrics=off index.html main.js styles.css serve.py tests scripts
